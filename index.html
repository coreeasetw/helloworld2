<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水電行地圖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero__overlay"></div>
    <div class="hero__content">
      <p class="eyebrow">在地水電專家</p>
      <h1>台北水電行地圖</h1>
      <p class="subtitle">快速找到附近可靠的水電行，查看評價、電話與導航連結。</p>
      <div class="controls">
        <input id="search" type="search" placeholder="搜尋店名、地址或關鍵字" aria-label="搜尋店名或地址" />
        <select id="category">
          <option value="">全部類別</option>
        </select>
        <select id="sort">
          <option value="rating">按評分排序</option>
          <option value="name">按名稱排序</option>
        </select>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="list" class="grid" aria-live="polite"></section>
    <div id="empty" class="empty" hidden>沒有符合條件的店家，請嘗試其他關鍵字。</div>
  </main>

  <template id="card-template">
    <article class="card">
      <div class="card__image" role="presentation"></div>
      <div class="card__body">
        <div class="card__header">
          <div>
            <p class="card__eyebrow">#水電行</p>
            <h2 class="card__title"></h2>
          </div>
          <span class="badge rating"></span>
        </div>
        <p class="card__category"></p>
        <p class="card__address"></p>
        <p class="card__status"></p>
        <p class="card__review"></p>
        <div class="card__meta">
          <a class="chip" target="_blank" rel="noopener" title="在地圖開啟">查看地圖</a>
          <a class="chip" href="tel:" title="撥打電話"></a>
        </div>
      </div>
    </article>
  </template>

  <script src="main.js"></script>
</body>
</html>
